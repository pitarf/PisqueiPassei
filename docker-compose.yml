services:
  postgres:
    image: postgres:17-alpine
    container_name: transpetro_postgres
    restart: always
    environment:
      POSTGRES_USER: transpetro_user
      POSTGRES_PASSWORD: transpetro_pass
      POSTGRES_DB: transpetro_study
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    driver: local
